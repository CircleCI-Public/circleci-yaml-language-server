version: 2.1

# Expected environment variables:
#
# GITHUB_TOKEN:
#   Github token with "repo" rights on the project.
#   Used for release
#

parameters:
  GHA_Event:
    type: string
    default: ""
  GHA_Actor:
    type: string
    default: ""
  GHA_Action:
    type: string
    default: ""
  GHA_Meta:
    type: string
    default: ""
  setup_go:
    type: string
    default: github.com/circleci-functions/setup-go@v0.5.3-4edeb2a

orbs:
  snyk: snyk/snyk@2.2.0
  github-cli: circleci/github-cli@2.2.0

executors:
  linux:
    machine:
      image: ubuntu-2604:current
    resource_class: large.gen3

  # Only runs the arm64 binaries, in containers.
  linux-arm:
    machine:
      image: ubuntu-2604:current
    resource_class: arm.medium

  macos:
    macos:
      xcode: 26.5.0

  windows:
    machine: true
    resource_class: windows.medium

  go-executor:
    docker:
      - image: cimg/go:1.27.1

commands:
  setup:
    steps:
      - checkout
      - install-go
      - install-task

  # Installs the toolchain and restores the module, build and lint caches, saved at job end.
  install-go:
    steps:
      - run: circleci run << pipeline.parameters.setup_go >> --
          --version-file go.mod
          --golangci-lint-cache
          --checksum '{{ checksum "go.sum" }}_{{ checksum "tools/go.sum" }}'
      - run: go version

  install-task:
    steps:
      - run:
          name: Install go-task
          command: |
            sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b "$HOME/.local/bin"
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"

  # Wraps steps that use Zig (`task zig`) so its download is cached in bin/zig.
  with-zig-cache:
    parameters:
      steps:
        type: steps
    steps:
      - restore_cache:
          keys:
            - zig-{{ arch }}-{{ checksum "cmd/ci/install_zig/install_zig.go" }}
      - steps: << parameters.steps >>
      - save_cache:
          key: zig-{{ arch }}-{{ checksum "cmd/ci/install_zig/install_zig.go" }}
          paths:
            - bin/zig

  store_results:
    steps:
      - store_test_results:
          path: ./test-reports

jobs:
  Create version file:
    executor: go-executor
    description: |
      Write the version being released to ~/version, for `task ci:build` and
      `task ci:smoke-test`.
    parameters:
      is-prerelease:
        type: boolean
        description: |
          When set to true will set a prerelease in the version file.
          Else will set the version from the release-please manifest
    steps:
      - checkout
      - when:
          condition: << parameters.is-prerelease >>
          steps:
            - run:
                name: Write the pre-release version in the version file
                command: |
                  go run ~/project/cmd/ci/get_next_release/get_next_release.go > ~/version
      - when:
          condition:
            not: << parameters.is-prerelease >>
          steps:
            - run:
                name: Write the next release version in the version file
                command: |
                  version=$(jq -r '.["."]' ~/project/.circleci/release/release-please-manifest.json)
                  echo "$version" > ~/version
      - persist_to_workspace:
          root: ~/
          paths:
            - version

  check:
    executor: linux
    steps:
      - setup
      - run: task ci:check
      - store_results

  test:
    parameters:
      os:
        type: enum
        enum: [linux, macos, windows]
    executor: << parameters.os >>
    steps:
      - setup
      - with-zig-cache:
          steps:
            - run: task ci:test
      - store_results

  # Cross-compiles and packages every target with goreleaser, leaving the
  # release in dist/release. Signs the darwin binaries when the
  # macos-codesigning context is attached.
  build:
    parameters:
      release:
        type: boolean
        default: false
        description: Build the version in the workspace's version file, rather than 0.0.0-dev.
    executor: linux
    steps:
      - setup
      - when:
          condition: << parameters.release >>
          steps:
            - attach_workspace:
                at: ~/
      - with-zig-cache:
          steps:
            - run: task ci:build
      - store_artifacts:
          path: dist/release
      - persist_to_workspace:
          root: ~/
          paths:
            - project/dist/release

  smoke-test:
    parameters:
      executor:
        type: enum
        enum: [linux, linux-arm, macos, windows]
    executor: << parameters.executor >>
    steps:
      - checkout
      - install-task
      - attach_workspace:
          at: ~/
      - run: task ci:smoke-test

  Github Release:
    docker:
      - image: cimg/node:lts
    steps:
      - run:
          name: "Releasing"
          command: |
            npx release-please github-release \
              --draft \
              --token $GITHUB_TOKEN \
              --repo-url $CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME \
              --target-branch $CIRCLE_BRANCH \
              --config-file .circleci/release/release-please-config.json \
              --manifest-file .circleci/release/release-please-manifest.json

  Prepare next release PR:
    docker:
      - image: cimg/node:lts
    steps:
      - run:
          name: "Creating/updating Release PR"
          command: |
            npx release-please release-pr \
                --token $GITHUB_TOKEN \
                --repo-url $CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME \
                --target-branch $CIRCLE_BRANCH \
                --config-file .circleci/release/release-please-config.json \
                --manifest-file .circleci/release/release-please-manifest.json

  Pre-Release:
    executor: go-executor
    steps:
      - checkout
      - attach_workspace:
          at: ~/
      - run:
          name: Install ghr
          command: go install github.com/tcnksm/ghr@latest
      - run:
          name: Clone the public repo
          command: |
            REPO_PATH=$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME
            git clone https://${GITHUB_TOKEN}@github.com/$REPO_PATH.git /tmp/to-deploy
      - run:
          name: Set global user git config
          command: |
            git config --global user.name "CircleCI"
            git config --global user.email "developer_experience@circleci.com"
      - run:
          name: Publish the binaries
          command: |
            set -ex
            cd /tmp/to-deploy
            export TAG=$(cat ~/version)
            ghr -name v$TAG -prerelease -delete -replace -c `git rev-parse HEAD` $TAG ~/project/dist/release/

  Upload artifacts:
    docker:
      - image: cimg/base:stable
    steps:
      - github-cli/install:
          version: "2.37.0"
      - checkout
      - attach_workspace:
          at: ~/
      - run:
          name: Extract version from manifest
          command: |
            version=$(jq -r '.["."]' ~/project/.circleci/release/release-please-manifest.json)
            echo "export VERSION=$version" >> "$BASH_ENV"
      - run:
          name: Stop job if release is not a draft
          command: |
            is_draft=$(gh release view --json isDraft --jq '.isDraft' $VERSION)
            [ x$is_draft = "xtrue" ] || circleci-agent step halt
      - run:
          name: Uploading to GitHub Release
          command: |
            GITHUB_REPO_URL=$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME
            cd ~/project/dist/release
            for FILE in *; do
                gh release upload --repo $GITHUB_REPO_URL $VERSION "$FILE"
            done
            gh release edit --repo $GITHUB_REPO_URL $VERSION --draft=false

      - store_artifacts:
          name: Saving the release
          path: dist/release
          destination: .

  Security Scan release:
    executor: go-executor
    steps:
      - checkout
      - run:
          name: Setup Scanning
          command: |
            git config --global url."https://$GITHUB_USER:$GITHUB_TOKEN@github.com/circleci/".insteadOf "https://github.com/circleci/"
      - snyk/scan:
          fail-on-issues: false
          severity-threshold: high
          monitor-on-build: false
          project: "${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}"

workflows:
  Build and prerelease:
    when: &release-conditions
      or:
        - equal:
            - << pipeline.git.branch >>
            - main
        - matches:
            value: << pipeline.git.branch >>
            pattern: ^hotfix.*$
    jobs:
      - check
      - test:
          matrix:
            parameters:
              os: [linux, macos, windows]
      - Security Scan release:
          context:
            - devex-release
            - org-global-employees
      - Create version file:
          is-prerelease: true
          context:
            - devex-release
      - build:
          release: true
          requires:
            - Create version file
          context:
            - macos-codesigning
      - smoke-test:
          matrix:
            parameters:
              executor: [linux, linux-arm, macos, windows]
          requires:
            - build
      - Pre-Release:
          requires:
            - check
            - test
            - Security Scan release
            - smoke-test
          context:
            - devex-release

  Build and release:
    when: *release-conditions
    jobs:
      - check
      - test:
          matrix:
            parameters:
              os: [linux, macos, windows]
      - Security Scan release:
          context:
            - devex-release
            - org-global-employees
      - Create version file:
          is-prerelease: false
      - build:
          release: true
          requires:
            - Create version file
          context:
            - macos-codesigning
      - smoke-test:
          matrix:
            parameters:
              executor: [linux, linux-arm, macos, windows]
          requires:
            - build
      - Github Release:
          requires:
            - check
            - test
            - Security Scan release
            - smoke-test
          context:
            - devex-release
      - Upload artifacts:
          requires:
            - Github Release
          context:
            - devex-release
      - Prepare next release PR:
          name: Create/update release PR
          requires:
            - Upload artifacts
          context:
            - devex-release

  # A dry run of the release: the same build and smoke tests, at 0.0.0-dev,
  # unsigned, and published nowhere.
  Build and test:
    when:
      not: *release-conditions
    jobs:
      - check
      - test:
          matrix:
            parameters:
              os: [linux, macos, windows]
      - build
      - smoke-test:
          matrix:
            parameters:
              executor: [linux, linux-arm, macos, windows]
          requires:
            - build
