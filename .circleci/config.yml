version: 2.1

# Expected environment variables:
#
# GITHUB_TOKEN:
#   Github token with "repo" rights on the project, from the devex-release
#   context. Used by `task ci:release`.
#

parameters:
  GHA_Event:
    type: string
    default: ""
  GHA_Actor:
    type: string
    default: ""
  GHA_Action:
    type: string
    default: ""
  GHA_Meta:
    type: string
    default: ""
  setup_go:
    type: string
    default: github.com/circleci-functions/setup-go@v0.5.3-4edeb2a

orbs:
  snyk: snyk/snyk@2.2.0

executors:
  default:
    docker:
      - image: cimg/base:current

  linux:
    machine:
      image: ubuntu-2604:current
    resource_class: large.gen3

  # Only runs the arm64 binaries, in containers.
  linux-arm:
    machine:
      image: ubuntu-2604:current
    resource_class: arm.medium

  macos:
    macos:
      xcode: 26.5.0

  windows:
    machine: true
    resource_class: windows.medium

commands:
  setup:
    steps:
      - checkout
      - install-go
      - install-task

  # Installs the toolchain and restores the module, build and lint caches, saved at job end.
  install-go:
    steps:
      - run: circleci run << pipeline.parameters.setup_go >> --
          --version-file go.mod
          --golangci-lint-cache
          --checksum '{{ checksum "go.sum" }}_{{ checksum "tools/go.sum" }}'
      - run: go version

  install-task:
    steps:
      - run:
          name: Install go-task
          # The curlrc also makes the script's own release download retry.
          command: |
            export CURL_HOME="$(mktemp -d)"
            printf '%s\n' retry=5 retry-delay=2 retry-all-errors > "$CURL_HOME/.curlrc"
            curl --fail --silent --show-error --location https://taskfile.dev/install.sh -o "$CURL_HOME/install.sh"
            sh "$CURL_HOME/install.sh" -d -b "$HOME/.local/bin"
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"

  # Wraps steps that use Zig (`task zig`) so its download is cached in bin/zig.
  with-zig-cache:
    parameters:
      steps:
        type: steps
    steps:
      - restore_cache:
          keys:
            - zig-{{ arch }}-{{ checksum "cmd/ci/install_zig/install_zig.go" }}
      - steps: << parameters.steps >>
      - save_cache:
          key: zig-{{ arch }}-{{ checksum "cmd/ci/install_zig/install_zig.go" }}
          paths:
            - bin/zig

  store_results:
    steps:
      - store_test_results:
          path: ./test-reports

jobs:
  check:
    executor: linux
    steps:
      - setup
      - run: task ci:check
      - store_results

  test:
    parameters:
      os:
        type: enum
        enum: [linux, macos, windows]
    executor: << parameters.os >>
    steps:
      - setup
      # Only Windows compiles with Zig. Elsewhere bin/zig is never made, and
      # its cache would be saved empty under the key the other jobs restore.
      - when:
          condition:
            equal: [windows, << parameters.os >>]
          steps:
            - with-zig-cache:
                steps:
                  - run: task ci:test
      - unless:
          condition:
            equal: [windows, << parameters.os >>]
          steps:
            - run: task ci:test
      - store_results

  coverage:
    executor: linux
    steps:
      - setup
      - run: task cover
      - store_artifacts:
          path: test-reports/coverage.html

  # The dry run of the release: cross-compiles and packages every target with
  # goreleaser at 0.0.0-dev, unsigned, leaving the release in dist/release.
  build:
    executor: linux
    steps:
      - setup
      - with-zig-cache:
          steps:
            - run: task ci:build
      - store_artifacts:
          path: dist/release
      - persist_to_workspace:
          root: ~/
          paths:
            - project/dist/release

  # Runs the dry run's binaries, or with `published` downloads the release's.
  smoke-test:
    parameters:
      executor:
        type: enum
        enum: [linux, linux-arm, macos, windows]
      published:
        type: boolean
        default: false
    executor: << parameters.executor >>
    steps:
      - checkout
      - install-task
      - attach_workspace:
          at: ~/
      - when:
          condition: << parameters.published >>
          steps:
            - run: task ci:smoke-test:published
      - unless:
          condition: << parameters.published >>
          steps:
            - run: task ci:smoke-test

  # Publishes this commit's release with goreleaser: the stable release when a
  # release PR was just merged, and otherwise the next prerelease. Signs and
  # notarises the darwin binaries.
  release:
    executor: linux
    resource_class: xlarge.gen3
    steps:
      - setup
      - with-zig-cache:
          steps:
            - run: task ci:release
      - store_artifacts:
          path: dist
      - persist_to_workspace:
          root: ~/
          paths:
            - project/dist/metadata.json

  Security Scan release:
    executor: default
    steps:
      - setup
      - run:
          name: Setup Scanning
          command: |
            git config --global url."https://$GITHUB_USER:$GITHUB_TOKEN@github.com/circleci/".insteadOf "https://github.com/circleci/"
      - snyk/scan:
          fail-on-issues: false
          severity-threshold: high
          monitor-on-build: false
          project: "${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}"

workflows:
  Build and release:
    when: &release-conditions
      or:
        - equal:
            - << pipeline.git.branch >>
            - main
        - matches:
            value: << pipeline.git.branch >>
            pattern: ^hotfix.*$
    jobs:
      - check
      - test:
          matrix:
            parameters:
              os: [linux, macos, windows]
      - coverage
      - Security Scan release:
          context:
            - devex-release
            - org-global-employees
      - release:
          # One release at a time, so two merges can't both take a version.
          serial-group: << pipeline.project.slug >>/release
          requires:
            - check
            - test
            - Security Scan release
          context:
            - devex-release
            - macos-codesigning
      - smoke-test:
          matrix:
            parameters:
              executor: [linux, linux-arm, macos, windows]
          published: true
          requires:
            - release

  # A dry run of the release: the same build and smoke tests, at 0.0.0-dev,
  # unsigned, and published nowhere.
  Build and test:
    when:
      not: *release-conditions
    jobs:
      - check
      - test:
          matrix:
            parameters:
              os: [linux, macos, windows]
      - coverage
      - build
      - smoke-test:
          matrix:
            parameters:
              executor: [linux, linux-arm, macos, windows]
          requires:
            - build
