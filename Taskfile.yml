version: "3"

vars:
  RESULTS_DIR: test-reports
  LINT_REPORT: test-reports/lint.xml

tasks:
  build:
    desc: Build server binary.
    cmds:
      - task: build:server

  build:all:
    desc: Build all binaries
    cmds:
      - task: build:parser
      - task: build:server
      - task: build:test-tree-sitter

  build:do:
    internal: true
    cmds:
      - bash -c "go build {{.BUILD_FLAGS}} -o {{.BIN_PATH}}{{if eq OS "windows"}}'.exe'{{end}} {{.GO_FILE}}"
    vars:
      BUILD_FLAGS: '{{default "" .BUILD_FLAGS}}'

  build:parser:
    cmds:
      - task: build:do
        vars:
          BIN_PATH: bin/parser
          GO_FILE: cmd/parse_yaml/parse_yaml.go

  build:server:
    desc: Build server binary
    cmds:
      - task: build:do
        vars:
          BIN_PATH: bin/start_server
          GO_FILE: cmd/start_server/start_server.go

  build:server:debug:
    desc: Build server binary without optimizations
    cmds:
      - task: build:do
        vars:
          BIN_PATH: bin/start_server
          BUILD_FLAGS: -gcflags='all=-N -l'
          GO_FILE: cmd/start_server/start_server.go

  build:test-tree-sitter:
    cmds:
      - task: build:do
        vars:
          BIN_PATH: bin/test-tree-sitter
          GO_FILE: cmd/test_tree-sitter/test_tree-sitter.go

  run:
    cmds:
      - go run cmd/start_server/start_server.go

  start:
    cmds:
      - ./bin/start_server
    env:
      PORT: "{{.PORT | default 10001}}"

  init:
    - go mod download

  licenses:
    - go-licenses csv ./cmd/start_server >licenses.csv 2>licenses.errors

  lint:
    desc: Run golangci-lint
    vars:
      ARGS: '{{default "./..." .CLI_ARGS}}'
    cmds:
      - go tool -modfile tools/go.mod golangci-lint run {{.ARGS}}

  fmt:
    desc: Format the code
    vars:
      ARGS: '{{default "./..." .CLI_ARGS}}'
    cmds:
      - go tool -modfile tools/go.mod golangci-lint fmt {{.ARGS}}

  mod-tidy:
    desc: Run 'go mod tidy'
    vars:
      ARGS: '{{default "-v" .CLI_ARGS}}'
    cmds:
      - go mod tidy {{.ARGS}}
      - go -C tools mod tidy {{.ARGS}}

  check:
    desc: Run all static checks
    cmds:
      - task: fmt
        vars:
          CLI_ARGS: ./... --diff
      - task: lint
      - task: mod-tidy
        vars:
          CLI_ARGS: -diff

  fix:
    desc: Auto-fix static checks
    cmds:
      - task: fmt
      - task: mod-tidy
      - task: lint
        vars:
          CLI_ARGS: ./... --fix

  prepare:vscode:
    dir: editors/vscode
    cmds:
      - yarn install --immutable
      - yarn run build

  test:
    desc: Run unit and acceptance tests
    vars:
      ARGS: '{{default "./..." .CLI_ARGS}}'
    cmds:
      - go tool -modfile tools/go.mod gotestsum -- -race -count=1 {{.ARGS}}

  probe:
    desc: Run every contract probe against the real APIs
    cmds:
      - task: probe:orb
      - task: probe:dockerhub

  probe:orb:
    desc: Probe the CircleCI orb registry (pass a reference with -- circleci/go@1.7)
    cmds:
      - go run ./cmd/orb {{.CLI_ARGS}}

  probe:dockerhub:
    desc: Probe the Docker Hub API (pass a repository with -- cimg/go)
    cmds:
      - go run ./cmd/dockerhub {{.CLI_ARGS}}

  validate:
    desc: Run all necessary task to build, lint and test the project
    deps:
      - prepare:vscode
    cmds:
      - task: lint
      - task: build:all
      - task: test

  # CI tasks

  ci:lint:
    desc: Lint with JUnit output
    cmds:
      - mkdir -p "{{.RESULTS_DIR}}"
      - task: lint
        vars:
          CLI_ARGS: |
            ./... \
            --output.junit-xml.path "{{.LINT_REPORT}}" --output.junit-xml.extended \
            --output.text.path=stdout --output.text.colors=true

  ci:test:
    desc: Run tests with JUnit output
    cmds:
      - mkdir -p "{{.RESULTS_DIR}}"
      - circleci testsuite run "ci tests"

  ci:check:
    desc: Run all static checks, with JUnit output
    cmds:
      - task: fmt
        vars:
          CLI_ARGS: ./... --diff
      - task: ci:lint
      - task: mod-tidy
        vars:
          CLI_ARGS: -diff
