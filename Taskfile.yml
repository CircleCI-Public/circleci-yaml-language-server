version: "3"

vars:
  RESULTS_DIR: test-reports
  LINT_REPORT: test-reports/lint.xml
  # Where `task snapshot` leaves the release, under its published names.
  RELEASE_DIR: dist/release
  # The release CI builds is in ~/version, written by its `Create version
  # file` job. Branch builds have none.
  VERSION_CMD: cat "$HOME/version" 2>/dev/null || echo 0.0.0-dev

tasks:
  build:
    desc: Build server binary.
    cmds:
      - task: build:server

  build:do:
    internal: true
    cmds:
      - bash -c "go build {{.BUILD_FLAGS}} -o {{.BIN_PATH}}{{if eq OS "windows"}}'.exe'{{end}} {{.GO_FILE}}"
    vars:
      BUILD_FLAGS: '{{default "" .BUILD_FLAGS}}'

  build:server:
    desc: Build server binary
    cmds:
      - task: build:do
        vars:
          BIN_PATH: bin/start_server
          GO_FILE: ./cmd/server

  build:server:debug:
    desc: Build server binary without optimizations
    cmds:
      - task: build:do
        vars:
          BIN_PATH: bin/start_server
          BUILD_FLAGS: -gcflags='all=-N -l'
          GO_FILE: ./cmd/server

  run:
    cmds:
      - go run ./cmd/server

  licenses:
    - go-licenses csv ./cmd/server >licenses.csv 2>licenses.errors

  zig:
    desc: Install the pinned Zig into bin/zig, and print its path
    cmds:
      - go run ./cmd/ci/install_zig

  release-check:
    desc: Check the goreleaser config
    cmds:
      - go tool -modfile tools/go.mod goreleaser check

  snapshot:
    desc: Build and package every release target into dist/ (set VERSION=x.y.z)
    vars:
      VERSION: '{{default "0.0.0-dev" .VERSION}}'
      ZIG:
        sh: go run ./cmd/ci/install_zig
    env:
      VERSION: '{{.VERSION}}'
      ZIG: '{{.ZIG}}'
    cmds:
      - go tool -modfile tools/go.mod goreleaser release --snapshot --clean
      - go run ./cmd/ci/stage_release -out {{.RELEASE_DIR}}

  lint:
    desc: Run golangci-lint
    vars:
      ARGS: '{{default "./..." .CLI_ARGS}}'
    cmds:
      - go tool -modfile tools/go.mod golangci-lint run {{.ARGS}}

  fmt:
    desc: Format the code
    vars:
      ARGS: '{{default "./..." .CLI_ARGS}}'
    cmds:
      - go tool -modfile tools/go.mod golangci-lint fmt {{.ARGS}}

  mod-tidy:
    desc: Run 'go mod tidy'
    vars:
      ARGS: '{{default "-v" .CLI_ARGS}}'
    cmds:
      - go mod tidy {{.ARGS}}
      - go -C tools mod tidy {{.ARGS}}

  check:
    desc: Run all static checks
    cmds:
      - task: fmt
        vars:
          CLI_ARGS: ./... --diff
      - task: lint
      - task: mod-tidy
        vars:
          CLI_ARGS: -diff
      - task: release-check

  fix:
    desc: Auto-fix static checks
    cmds:
      - task: fmt
      - task: mod-tidy
      - task: lint
        vars:
          CLI_ARGS: ./... --fix

  prepare:vscode:
    dir: editors/vscode
    cmds:
      - yarn install --immutable
      - yarn run build

  test:
    desc: Run unit and acceptance tests
    vars:
      ARGS: '{{default "./..." .CLI_ARGS}}'
    cmds:
      - go tool -modfile tools/go.mod gotestsum -- -race -count=1 {{.ARGS}}

  probe:
    desc: Run every contract probe against the real APIs
    cmds:
      - task: probe:orb
      - task: probe:dockerhub

  probe:orb:
    desc: Probe the CircleCI orb registry (pass a reference with -- circleci/go@1.7)
    cmds:
      - go run ./cmd/dev/orb {{.CLI_ARGS}}

  probe:dockerhub:
    desc: Probe the Docker Hub API (pass a repository with -- cimg/go)
    cmds:
      - go run ./cmd/dev/dockerhub {{.CLI_ARGS}}

  survey:
    desc: Survey real configs (pass fetch, diagnose or compare with --; see cmd/dev/survey)
    cmds:
      - go run ./cmd/dev/survey {{.CLI_ARGS}}

  # CI tasks

  ci:lint:
    desc: Lint with JUnit output
    cmds:
      - mkdir -p "{{.RESULTS_DIR}}"
      - task: lint
        vars:
          CLI_ARGS: |
            ./... \
            --output.junit-xml.path "{{.LINT_REPORT}}" --output.junit-xml.extended \
            --output.text.path=stdout --output.text.colors=true

  ci:test:
    desc: Run tests with JUnit output
    vars:
      SUITE: '{{if eq OS "windows"}}windows tests{{else}}ci tests{{end}}'
      # Windows has no C compiler for cgo, so it gets the pinned Zig.
      CC:
        sh: '{{if eq OS "windows"}}echo "$(go run ./cmd/ci/install_zig) cc -target x86_64-windows-gnu"{{else}}go env CC{{end}}'
    env:
      CC: '{{.CC}}'
    cmds:
      - mkdir -p "{{.RESULTS_DIR}}"
      - circleci testsuite run "{{.SUITE}}"

  ci:check:
    desc: Run all static checks, with JUnit output
    cmds:
      - task: fmt
        vars:
          CLI_ARGS: ./... --diff
      - task: ci:lint
      - task: mod-tidy
        vars:
          CLI_ARGS: -diff
      - task: release-check

  ci:build:
    desc: Build and package the release at the version in ~/version
    cmds:
      - task: snapshot
        vars:
          VERSION:
            sh: '{{.VERSION_CMD}}'

  ci:smoke-test:
    desc: Check the staged binaries run here and report the version being released
    vars:
      VERSION:
        sh: '{{.VERSION_CMD}}'
      BINARY: '{{.RELEASE_DIR}}/{{OS}}-{{ARCH}}-lsp{{exeExt}}'
      # The oldest glibc anyone asked for (#266), and musl.
      IMAGES: centos:7 amazonlinux:2 ubuntu:20.04 alpine:3.20
    cmds:
      - |
        got="$("{{.BINARY}}" --version)"
        echo "{{.BINARY}}: $got"
        test "$got" = "{{.VERSION}}"
      - for:
          var: IMAGES
          split: ' '
        platforms: [linux]
        cmd: |
          got="$(docker run --rm --volume "$PWD/{{.RELEASE_DIR}}:/release" {{.ITEM}} /release/linux-{{ARCH}}-lsp --version)"
          echo "{{.ITEM}}: $got"
          test "$got" = "{{.VERSION}}"

