# Builds, packages and publishes the language server. On main, `task
# ci:release` tags the commit locally and runs `goreleaser release`, which
# publishes to GitHub. Branch builds are a dry run, `goreleaser release
# --snapshot` at 0.0.0-dev (see `task snapshot`), which publishes nowhere.

version: 2

project_name: circleci-yaml-language-server

snapshot:
  version_template: '{{ .Env.VERSION }}'

builds:
  - binary: circleci-yaml-lsp
    main: ./cmd/server
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # Embeds only the YAML grammar, not all of gotreesitter's.
    tags: [grammar_subset, grammar_subset_yaml]
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/CircleCI-Public/circleci-yaml-language-server/internal/version.Server={{ .Version }}

# Signs and notarises the darwin binaries with quill, which runs on Linux.
# Skipped when the macos-codesigning context isn't attached (branch builds).
notarize:
  macos:
    - enabled: '{{ isEnvSet "QUILL_SIGN_P12" }}'
      sign:
        certificate: '{{ envOrDefault "QUILL_SIGN_P12" "" }}'
      notarize:
        issuer_id: '{{ envOrDefault "QUILL_NOTARY_ISSUER" "" }}'
        key_id: '{{ envOrDefault "QUILL_NOTARY_KEY_ID" "" }}'
        key: '{{ envOrDefault "QUILL_NOTARY_KEY" "" }}'

archives:
  - id: archive
    files:
      - LICENSE.md
      - CREDITS.md
      - schema.json
    format_overrides:
      - goos: windows
        formats: [zip]

  # The bare binaries under the names every release has had, which the VS Code
  # extension and circleci-yaml-mode.el download: {os}-{arch}-lsp[.exe].
  # Goreleaser only renames them when it uploads, so `task snapshot` copies
  # them out of dist/ for the dry run.
  - id: binary
    formats: [binary]
    name_template: '{{ .Os }}-{{ .Arch }}-lsp'

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  github:
    owner: CircleCI-Public
    name: circleci-yaml-language-server
  # release-please's draft of a stable release is named v<version>, so it's
  # found and published, keeping release-please's notes. Prereleases get a
  # release of their own.
  name_template: 'v{{ .Version }}'
  use_existing_draft: true
  mode: keep-existing
  prerelease: auto
  # The tag is only made locally, so GitHub makes it when the release is
  # published.
  target_commitish: '{{ .FullCommit }}'
  extra_files:
    - glob: ./schema.json
